title: PM
tagline: while black
description: "PM While Black: making product management careers more accessible to the Black community."
url: https://pmwhileblack.com
baseurl: ""
timezone: UTC

# Number of posts shown on the home page before "View all posts"
home_post_count: 2

# New posts get the same URL shape WordPress used, plus these defaults
permalink: /:year/:month/:day/:title/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: "Kayiita Johansson"

plugins:
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
